[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cliper-bot"
version = "1.0.0"
description = "A private Telegram studio for turning long videos into captioned vertical clips"
requires-python = ">=3.11,<3.14"
dependencies = [
  "python-telegram-bot>=22.5,<23",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "yt-dlp[default]>=2026.3.3",
  "opencv-python-headless>=4.10,<5",
  "imageio-ffmpeg>=0.6,<0.7",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
transcribe = ["faster-whisper>=1.1,<2"]
gpu = [
  "faster-whisper>=1.1,<2",
  "nvidia-cublas-cu12>=12.4,<13; sys_platform == 'win32' or sys_platform == 'linux'",
  "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'win32' or sys_platform == 'linux'",
  "nvidia-cuda-runtime-cu12>=12.4,<13; sys_platform == 'win32' or sys_platform == 'linux'",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
cliper = "cliper.cli:main"

[tool.setuptools.packages.find]
include = ["cliper*"]

[tool.setuptools.package-data]
cliper = ["*.ps1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
